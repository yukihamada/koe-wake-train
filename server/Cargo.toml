[package]
name = "koe-wake-train"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ulid = "1"
dashmap = "6"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
