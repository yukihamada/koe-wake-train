app = "koe-wake-train"
primary_region = "nrt"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[env]
  BASE_URL = "https://koe-wake-train.fly.dev"
  JOBS_DIR = "/tmp/koe-jobs"
  PIPER_SAMPLE_GENERATOR_PATH = "/opt/piper-sample-generator"

[[vm]]
  # torch CPU training needs real CPUs and enough RAM
  size = "performance-2x"
  memory = "4gb"
